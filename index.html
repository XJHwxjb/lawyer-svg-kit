<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>法律视频 · 人物动作素材库</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 40 40" class="sealIcon" aria-hidden="true">
      <circle cx="20" cy="20" r="18" fill="#d43a2f"/>
      <circle cx="20" cy="20" r="13.5" fill="none" stroke="#e9a13b" stroke-width="1.6"/>
      <path d="M20,11 l2.6,5.4 5.9,.8 -4.3,4.2 1,5.9 -5.2,-2.8 -5.2,2.8 1,-5.9 -4.3,-4.2 5.9,-.8 Z" fill="#e9a13b"/>
    </svg>
    <div>
      <h1>法律视频 · 人物动作素材库</h1>
      <span class="ver">SVG KIT v0.4 · 16 人物 · 36 动作 · 双画幅 16:9 / 9:16</span>
    </div>
  </div>
  <div class="topRight">
    <span id="readout" class="readout">0.00s · f0</span>
    <button id="soundBtn" class="sound on">声音：开</button>
  </div>
</header>

<main class="layout">
  <div class="libCol">
    <div class="libToggle" role="tablist" aria-label="库模式">
      <button id="modeActs" class="modeBtn on" role="tab">动作库</button>
      <button id="modeChars" class="modeBtn" role="tab">人物图鉴</button>
    </div>
    <aside class="libs" id="libs" aria-label="动作列表"></aside>
  </div>

  <section class="stageWrap">
    <div class="stageHead">
      <span id="catChip" class="catChip">物件交接</span>
      <strong id="actName">文书递接</strong>
      <div class="orientToggle" role="tablist" aria-label="画幅" title="项目画幅·单选：选定后自动保存，导出跟随；重置/随机不改变">
        <button id="orientLand" class="orientBtn on" role="tab" aria-selected="true">
          <svg viewBox="0 0 20 14" aria-hidden="true"><rect x="1" y="1" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          横屏<span class="ratio">16:9</span>
        </button>
        <button id="orientPort" class="orientBtn" role="tab" aria-selected="false">
          <svg viewBox="0 0 20 14" aria-hidden="true"><rect x="5" y="0.5" width="10" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          竖屏<span class="ratio">9:16</span>
        </button>
      </div>
      <span id="canvasBadge" class="canvasBadge">1920 × 1080</span>
      <span id="phaseChip" class="phaseChip"></span>
    </div>
    <div id="variantRow" class="chipRow" hidden></div>
    <div id="charActs" class="chipRow" hidden></div>
    <div class="stageBox">
      <svg id="stage" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
        <defs>
          <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
            <stop id="bgStop1" offset="0" stop-color="#f6ecd9"/>
            <stop id="bgStop2" offset="1" stop-color="#e7dabf"/>
          </linearGradient>
          <filter id="cutout" x="-40%" y="-40%" width="180%" height="180%">
            <feMorphology id="cutDilate" in="SourceAlpha" operator="dilate" radius="6" result="d"/>
            <feFlood flood-color="#fff6e8" result="f"/>
            <feComposite in="f" in2="d" operator="in" result="o"/>
            <feDropShadow id="cutShadow" in="o" dx="0" dy="9" stdDeviation="6" flood-color="#1a1408" flood-opacity=".35" result="s"/>
            <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="grain">
            <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/>
            <feColorMatrix type="saturate" values="0"/>
            <feComponentTransfer><feFuncA type="linear" slope=".07"/></feComponentTransfer>
          </filter>
        </defs>
        <rect id="bgRect" width="1920" height="1080" fill="url(#bgGrad)"/>
        <rect id="groundRect" y="945" width="1920" height="135" fill="#d9c9a8"/>
        <line id="groundLine" x1="0" y1="945" x2="1920" y2="945" stroke="#b7a687" stroke-width="2"/>
        <text id="stageVert" x="117" y="96" writing-mode="vertical-rl" font-size="28.8" font-weight="700" letter-spacing="7" fill="#b7a687" opacity=".8">法律视频 · 人物动作素材库</text>
        <text id="stageNum" x="1803" y="259" text-anchor="end" font-size="172.5" font-weight="900" fill="#b7a687" opacity=".14">01</text>
        <g id="bgFurn"></g>
        <g id="sceneRoot"></g>
        <g id="guidesLayer" opacity="0">
          <path id="guideBase" d="M0,945 H1920 M960,-15 V945" stroke="#4d8fd1" stroke-width="1.5" stroke-dasharray="6 8" opacity=".45" fill="none"/>
          <path id="guidePath" fill="none" stroke="#4d8fd1" stroke-width="2.5" stroke-dasharray="10 8" opacity=".8"/>
          <g id="guideCross" stroke="#c25062" stroke-width="2.5" fill="none" opacity=".9"></g>
        </g>
        <rect id="grainRect" width="1920" height="1080" filter="url(#grain)" opacity=".5" pointer-events="none"/>
      </svg>
    </div>
    <div class="stageFoot">
      <div class="transport">
        <button id="playBtn" class="tbtn primary">暂停</button>
        <button id="restartBtn" class="tbtn">重播</button>
        <button id="loopBtn" class="tbtn on" aria-pressed="true">循环</button>
      </div>
      <div class="scrubWrap">
        <div class="ticks" id="ticks"></div>
        <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="时间轴">
      </div>
    </div>
    <p class="desc" id="actDesc"></p>
  </section>

  <aside class="controls" aria-label="实时参数">
    <div class="ctlGroup">
      <h3>播放</h3>
      <label class="row sel"><span class="lbl">速度</span>
        <select id="speed">
          <option value="0.5">0.5×</option><option value="0.75">0.75×</option>
          <option value="1" selected>1×</option><option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option><option value="2">2×</option>
        </select>
      </label>
    </div>
    <div class="ctlGroup">
      <h3>动作参数</h3>
      <label class="row"><span class="lbl">时长</span><input id="dur" type="range" min="2" max="8" step="0.1"><span class="val" id="durVal"></span></label>
      <label class="row sel"><span class="lbl">缓动</span>
        <select id="ease">
          <option value="smooth">平滑</option><option value="spring">弹性</option>
          <option value="back">回弹</option><option value="linear">线性</option>
        </select>
      </label>
      <label class="row"><span class="lbl">幅度</span><input id="amp" type="range" min="0.4" max="1.6" step="0.05"><span class="val" id="ampVal"></span></label>
    </div>
    <div class="ctlGroup">
      <h3>人物与风格</h3>
      <label class="row"><span class="lbl">缩放</span><input id="scale" type="range" min="0.7" max="1.3" step="0.02"><span class="val" id="scaleVal"></span></label>
      <label class="row"><span class="lbl">描边</span><input id="outline" type="range" min="0" max="12" step="1"><span class="val" id="outlineVal"></span></label>
      <label class="row"><span class="lbl">投影</span><input id="shadow" type="range" min="0" max="24" step="1"><span class="val" id="shadowVal"></span></label>
    </div>
    <div class="ctlGroup">
      <h3>场景</h3>
      <label class="row sel"><span class="lbl">色调</span>
        <select id="theme">
          <option value="cream">纸纹·暖</option><option value="mist">雾青·冷</option><option value="dusk">暮色·深</option>
        </select>
      </label>
      <label class="row sel"><span class="lbl">场景底</span>
        <select id="bg">
          <option value="paper">白纸纹理</option><option value="home">家中·桌</option>
          <option value="court">法庭·席</option><option value="register">登记处</option>
        </select>
      </label>
      <label class="row switchRow"><span class="lbl">参考线</span>
        <span class="switch"><input type="checkbox" id="guides"><i></i></span>
      </label>
    </div>
    <div class="ctlGroup">
      <h3>工具</h3>
      <div class="btnGrid">
        <button id="resetBtn">重置参数</button>
        <button id="randBtn">随机风格</button>
        <button id="exportSvgBtn" class="wide">导出当前帧 SVG</button>
        <button id="exportJsonBtn" class="wide">导出参数 JSON</button>
      </div>
    </div>
    <p class="hint">空格 播放/暂停 · ← → 逐帧 · O 切换画幅 · 时间轴可拖动 scrub<br>刻度标记 = 音效事件点</p>
  </aside>
</main>

<script src="kit.js"></script>
<script src="actions.js"></script>
<script src="app.js"></script>
</body>
</html>
